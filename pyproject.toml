[project]
name = "datapilot"
version = "0.1.0"
description = "DataPilot workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "contracts",
]

[tool.uv.sources]
contracts = { workspace = true }

[tool.uv.workspace]
members = [
    "libs/contracts",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
